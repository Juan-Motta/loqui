version: '3'

vars:
  APP_NAME: "loqui"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go test suite
    cmds:
      - ./scripts/go.sh test ./... {{.CLI_ARGS}}

  test:clipboard:
    summary: Runs the tests that touch the real macOS pasteboard (overwrites your clipboard)
    cmds:
      - LOQUI_TEST_CLIPBOARD=1 ./scripts/go.sh test ./internal/inject/ -run Clipboard -v -count=1

  vet:
    summary: go vet across the module
    cmds:
      - ./scripts/go.sh vet ./...

  typecheck:
    summary: Type-checks the frontend with the project's own TypeScript
    # A TASK, not just an npm script, because until this existed the frontend was never type-checked
    # by anything: vite STRIPS types without validating them, so a type error reached the packaged app
    # silently. Around 1500 lines of TS were written that way.
    #
    # It runs the TypeScript the repo pins — not one passed on a command line — which is the whole
    # point: a check that only works with an ad-hoc invocation is a check nobody runs.
    cmds:
      - cd frontend && npm run --silent typecheck

  check:
    summary: Everything that must pass before shipping — Go tests, vet, and the frontend types
    cmds:
      - task: test
      - task: vet
      - task: typecheck

  probe:
    summary: 'Run one dictation from the CLI. Needs SPEECH_KEY. Extra flags after --'
    cmds:
      - ./scripts/go.sh run ./cmd/stt-probe {{.CLI_ARGS}}

  probe:mic:
    summary: Check the microphone alone — levels only, contacts nothing
    cmds:
      - ./scripts/go.sh run ./cmd/stt-probe -mic-only -seconds 8

  probe:devices:
    summary: List input devices
    cmds:
      - ./scripts/go.sh run ./cmd/stt-probe -list
