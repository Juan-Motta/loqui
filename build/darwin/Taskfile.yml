version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          PORTABLE: '{{.PORTABLE | default "false"}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      PORTABLE: '{{.PORTABLE | default "false"}}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      # The native Speech SDK is not committed (10 MB of Mach-O), so a fresh clone has
      # to fetch it before the link step can resolve -framework. Idempotent and cheap.
      - ./scripts/vendor-speech-sdk.sh
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      PORTABLE: '{{.PORTABLE | default "false"}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      # The Azure Speech Go binding is cgo over the native SDK and declares no #cgo
      # directives of its own, so the include path and link flags have to come from
      # here. scripts/vendor-speech-sdk.sh puts the framework where these point.
      #
      # Absolute paths (ROOT_DIR) are not a shortcut: cgo runs the C compiler with the
      # *package's* directory as cwd, so a relative -I would resolve inside the module
      # cache and never find these headers.
      #
      # Portable builds omit the checkout rpath; ordinary bare development builds retain it.
      CGO_CFLAGS: "-mmacosx-version-min=14.0 -I{{.ROOT_DIR}}/third_party/speech-sdk/MicrosoftCognitiveServicesSpeech.framework/Headers"
      CGO_LDFLAGS: >-
        -mmacosx-version-min=14.0
        -Wl,-headerpad_max_install_names
        -F{{.ROOT_DIR}}/third_party/speech-sdk
        -framework MicrosoftCognitiveServicesSpeech
        -Wl,-rpath,@executable_path/../Frameworks
        {{if ne .PORTABLE "true"}}-Wl,-rpath,{{.ROOT_DIR}}/third_party/speech-sdk{{end}}
      MACOSX_DEPLOYMENT_TARGET: "14.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:helpers:
    summary: Builds the native macOS helpers and bundled dylibs
    platforms: [darwin]
    cmds:
      - '"${LOQUI_HELPERS_BUILD_SCRIPT:-./scripts/build-macos-helpers.sh}"'

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PORTABLE: 'true'
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    deps:
      - task: build:helpers
    cmds:
      - '"${LOQUI_PATCH_PLISTS_SCRIPT:-./scripts/patch-plists.sh}"'
      - '"${LOQUI_BUNDLE_SCRIPT:-./scripts/macos-bundle.sh}" --channel production --executable "{{.BIN_DIR}}/{{.APP_NAME}}" --helpers-dir "${LOQUI_HELPERS_OUTPUT_DIR:-{{.ROOT_DIR}}/helpers/bin}" --output "{{.BIN_DIR}}/{{.APP_NAME}}.app"'
      - '"${LOQUI_SIGN_SCRIPT:-./scripts/macos-sign.sh}" app --channel adhoc --app "{{.BIN_DIR}}/{{.APP_NAME}}.app"'

  run:
    deps:
      - task: build:helpers
    cmds:
      - '"${LOQUI_PATCH_PLISTS_SCRIPT:-./scripts/patch-plists.sh}"'
      - '"${LOQUI_BUNDLE_SCRIPT:-./scripts/macos-bundle.sh}" --channel development --executable "{{.BIN_DIR}}/{{.APP_NAME}}" --helpers-dir "${LOQUI_HELPERS_OUTPUT_DIR:-{{.ROOT_DIR}}/helpers/bin}" --output "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"'
      - '"${LOQUI_SIGN_SCRIPT:-./scripts/macos-sign.sh}" app --channel development --app "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"'
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  release:
    summary: Builds, signs, notarizes, staples, and verifies an arm64 Developer ID DMG
    cmds:
      - |
        set -e
        dmgbuild_python="${LOQUI_DMGBUILD_PYTHON:-$(./scripts/setup-dmgbuild.sh)}"
        [ -n "$dmgbuild_python" ]
        LOQUI_DMGBUILD_PYTHON="$dmgbuild_python" ./scripts/release-macos.sh

  render:dmg-background:
    summary: Regenerates both reviewed DMG background scales and their digests
    cmds:
      - swift build/darwin/dmg/render-background.swift build/darwin/dmg
      - cd build/darwin/dmg && shasum -a 256 background.png background@2x.png > background.sha256
